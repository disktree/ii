baseURL: ""
title: "ii"
languageCode: "en"
titleCaseStyle: "none"
defaultContentLanguage: "en"
description: "Serious Fucking Business"

buildDrafts: false
disableHugoGeneratorInject: true
disablePathToLower: true
enableGitInfo: true
enableRobotsTXT: true
ignoreFiles: ["/__"]
newcontenteditor: "nvim"
#RSSUri: "rss.xml"
#footnoteAnchorPrefix
#footnoteReturnLinkContents
#paginate: 100
#paginatePath: "list"
#rssLimit: 100

build:
  writeStats: true

markup:
  goldmark:
    renderer:
      unsafe: true
  highlight:
    noClasses: false

minify:
  minifyOutput: false
  keepComments: true
  keepConditionalComments: true

