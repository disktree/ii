#   replacements:
#     github.com/tong/gonzo -> /home/tong/dev/gonzo/
#   mounts:
#     - source: static
#       target: static

outputs:
  home: [html, rss]
  section: [html]
  taxonomy: [html]
  term: [html]
  page: [html]


sitemap:
  changefreq: "monthly"
  filename: "sitemap.xml"
  priority: 0.5

taxonomies:
  tag: "tags"
