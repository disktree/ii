baseURL: ""
title: "ii"
locale: "en"
titleCaseStyle: "none"
defaultContentLanguage: "en"
description: "Serious Fucking Business"

buildDrafts: false
disableHugoGeneratorInject: true
disablePathToLower: true
enableGitInfo: true
enableRobotsTXT: true
ignoreFiles: ["/__"]
newcontenteditor: "nvim"
#RSSUri: "rss.xml"
#footnoteAnchorPrefix
#footnoteReturnLinkContents
#paginate: 100
#paginatePath: "list"
#rssLimit: 100

build:
  writeStats: true

markup:
  goldmark:
    renderer:
      unsafe: true
  highlight:
    noClasses: false

minify:
  minifyOutput: false
  keepComments: true
  keepConditionalComments: true

module:
  mounts:
    - source: static
      target: static
    # JetBrains Mono variable font from npm (@fontsource-variable/jetbrains-mono)
    - source: node_modules/@fontsource-variable/jetbrains-mono/files
      target: static/font/jetbrains-mono
    # Inter variable font from npm (@fontsource-variable/inter), wght and opsz axes
    - source: node_modules/@fontsource-variable/inter/files
      target: static/font/inter

outputs:
  home: [html, rss]
  section: [html]
  taxonomy: [html]
  term: [html]
  page: [html]


sitemap:
  changefreq: "monthly"
  filename: "sitemap.xml"
  priority: 0.5

taxonomies:
  tag: "tags"
  # category: "categories"
# disableKinds:
# - taxonomy
# - term

