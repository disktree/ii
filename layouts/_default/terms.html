{{ define "main" }}
<header class="head"><h1>{{ .Title | upper }}</h1></header>
<div class="register">
  <div class="entries">
    {{- range .Data.Terms.Alphabetical }}
    <a class="work" href="{{ .Page.RelPermalink }}">{{ .Page.LinkTitle | upper }}<sup>{{ .Count }}</sup></a>
    {{ end -}}
  </div>
</div>
{{ end }}
