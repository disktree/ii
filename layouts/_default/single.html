{{ define "main" }}
<article class="single">
  <header class="page">
    <h1>{{ partial "label" . }}</h1>
    {{ with .Description }}<p class="lede">{{ . }}</p>{{ end }}
  </header>
  {{ partial "meta" . }}
  <div class="text">
    {{ block "body" . }}{{ .Content }}{{ end }}
  </div>
</article>
{{ partial "pager" . }}
{{ end }}
