{{ define "main" }}
<article class="single shot">
  <h1 class="title">{{ if .Title }}{{ .Title }}{{ else }}{{ .Date.Format "2006-01-02 15:04" }}{{ end }}</h1>
  {{- range .Resources.ByType "image" }}
  {{- $img := .Resize "2000x webp q85" }}
  <figure class="wide">
    <a href="{{ .RelPermalink }}"><img src="{{ $img.RelPermalink }}" width="{{ $img.Width }}" height="{{ $img.Height }}" alt="{{ $.Title | default "screenshot" }}"></a>
    <figcaption><a href="{{ .RelPermalink }}">{{ .Name }}</a> {{ .Width }}×{{ .Height }}</figcaption>
  </figure>
  {{- end }}
  {{ with .Content }}<div class="text">{{ . }}</div>{{ end }}
</article>
{{ end }}
