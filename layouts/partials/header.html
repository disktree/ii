<header class="site">
  <p class="logo"><a href="{{ "/" | relURL }}" rel="home" aria-label="{{ site.Title }}"{{ if .IsHome }} aria-current="page"{{ end }}><svg viewBox="0 0 100 100" aria-hidden="true"><circle cx="50" cy="50" r="50"/></svg></a></p>
  <nav aria-label="sections">
    <ul>
      {{- $current := . }}
      {{- range site.Params.mainSections }}
      {{- with site.GetPage (print "/" .) }}
      <li><a href="{{ .RelPermalink }}" data-key="{{ .Section }}"{{ if or (eq $current .) (and (eq $current.Section .Section) (not $current.IsHome)) }} aria-current="{{ if eq $current . }}page{{ else }}true{{ end }}"{{ end }}>{{ .Title | upper }}</a></li>
      {{- end }}
      {{- end }}
    </ul>
  </nav>
</header>
