{{- $current := . }}
<header class="site">
  <nav aria-label="main">
    <ul>
      <li class="home"><a href="{{ "/" | relURL }}" rel="home" aria-label="{{ site.Title }}"{{ if .IsHome }} class="current" aria-current="page"{{ end }}><svg viewBox="0 0 100 100" aria-hidden="true"><circle cx="50" cy="50" r="50"/></svg></a></li>
      {{- range site.Params.mainSections }}
      {{- with site.GetPage (print "/" .) }}
      <li><a href="{{ .RelPermalink }}" aria-label="{{ .Title }}"{{ if eq $current.Section .Section }} class="current"{{ end }}{{ if eq $current . }} aria-current="page"{{ end }}>{{ .Section | upper }}</a></li>
      {{- end }}
      {{- end }}
    </ul>
  </nav>
</header>
