<footer class="site">
  {{- if and .IsPage .Section }}
  <span class="pager">
    {{- with .PrevInSection }}<a rel="prev" href="{{ .RelPermalink }}" title="{{ partial "label" . }}">prev</a>{{ end }}
    {{- if and .PrevInSection .NextInSection }} · {{ end }}
    {{- with .NextInSection }}<a rel="next" href="{{ .RelPermalink }}" title="{{ partial "label" . }}">next</a>{{ end -}}
  </span>
  {{- end }}
  <span class="site-links">
    <a href="{{ "tags/" | relURL }}">tags</a>
    · <a href="{{ "index.xml" | relURL }}">rss</a>
    {{- with .GitInfo }}
    · <a href="{{ site.Params.repository }}/commit/{{ .Hash }}" title="{{ .Subject }}"><code>{{ .AbbreviatedHash }}</code></a>
    {{- end }}
  </span>
</footer>
