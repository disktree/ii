<footer class="site">
  <address>
    <a href="mailto:{{ site.Params.contact.email }}">{{ site.Params.contact.email }}</a><br>
    <a href="https://github.com/{{ site.Params.social.github }}">github</a>,
    <a href="https://mixcloud.com/{{ site.Params.social.mixcloud }}">mixcloud</a>,
    <a href="https://{{ site.Params.social.bandcamp }}.bandcamp.com">bandcamp</a>,
    <a href="https://soundcloud.com/{{ site.Params.social.soundcloud }}">soundcloud</a>,
    <a href="https://vimeo.com/{{ site.Params.social.vimeo }}">vimeo</a>
  </address>
  <p class="colophon">
    <a href="{{ "tags/" | relURL }}">tags</a>
    · <a href="{{ "index.xml" | relURL }}">rss</a>
    {{- with .GitInfo }}
    · <a href="{{ site.Params.repository }}/commit/{{ .Hash }}" title="{{ .Subject }}"><code>{{ .AbbreviatedHash }}</code></a>
    {{- end }}
  </p>
</footer>
