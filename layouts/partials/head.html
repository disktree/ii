{{- /* Page heading: reads like one row of the register. */ -}}
<header class="head">
  {{ if gt .Date.Year 1970 }}<time class="y" datetime="{{ .Date.Format "2006" }}">{{ .Date.Format "2006" }}</time>{{ else }}<span class="y"></span>{{ end }}
  <h1>{{ partial "label" . | upper }}</h1>
  {{ partial "meta" . }}
</header>
